name: api-ci

on:
  pull_request:
  push:
    branches: [master, main]

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high

  unitarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      # o gate de cobertura (90% em services/ e domain/, 80% global) está no jest.config.js
      - run: npm run test:cov
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: coverage/ }

  integracao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      # Testcontainers usa o Docker do runner
      - run: npm run test:int

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: tabloide, POSTGRES_USER: tabloide, POSTGRES_PASSWORD: tabloide }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tabloide" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://tabloide:tabloide@localhost:5432/tabloide
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      # up → down → up: toda migration precisa reverter
      - run: npm run db:migrate
      - run: npm run db:migrate:undo:all
      - run: npm run db:migrate

  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., push: false, tags: 'tabloide-api:ci' }
