name: api-deploy

# Depois do CI verde na branch principal. Migrations rodam antes de trocar as máquinas e
# precisam ser compatíveis com a versão anterior do código (expandir → migrar → contrair).
on:
  workflow_run:
    workflows: [api-ci]
    types: [completed]
    branches: [master, main]

concurrency:
  group: api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: producao
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      IMAGEM: registry.fly.io/tabloide-api:${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.workflow_run.head_sha }}' }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Build e push da imagem (tag = SHA)
        run: flyctl deploy --build-only --push --image-label ${{ github.event.workflow_run.head_sha }}

      - name: Migrations (porta 5432, fora do transaction pooler)
        run: |
          npm ci
          npm run db:migrate
        env:
          NODE_ENV: production
          DATABASE_URL_MIGRATIONS: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          DB_SSL: 'true'

      - name: Imagem atual (para rollback)
        id: anterior
        run: echo "imagem=$(flyctl image show --json | jq -r '.[0].Reference // empty')" >> "$GITHUB_OUTPUT"

      - name: Deploy rolling
        run: flyctl deploy --image "$IMAGEM" --strategy rolling --wait-timeout 300

      - name: Smoke test
        id: smoke
        run: |
          curl -fsS --retry 5 --retry-delay 5 "${{ vars.API_URL }}/v1/saude/pronto"
          curl -fsS --retry 5 --retry-delay 5 "${{ vars.API_URL }}/v1/publico/filiais/${{ vars.CODIGO_FILIAL_TESTE }}" > /dev/null

      - name: Rollback da imagem (migrations não são revertidas)
        if: failure() && steps.anterior.outputs.imagem != ''
        run: flyctl deploy --image "${{ steps.anterior.outputs.imagem }}" --strategy rolling
