# Host recomendado na Fase 5 (seção 11.7): 2 máquinas em São Paulo, sem cold start,
# readiness no health check e deploy rolling. Segredos via `fly secrets set`, nunca aqui.
app = 'tabloide-api'
primary_region = 'gru'
kill_signal = 'SIGTERM'
# drenagem (5 s) + fechamento do servidor (10 s) + folga
kill_timeout = '20s'

[deploy]
  strategy = 'rolling'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  TRUST_PROXY = '1'
  STORAGE_DRIVER = 'supabase'
  DB_SSL = 'true'
  LOG_LEVEL = 'info'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 2

  [[http_service.checks]]
    grace_period = '10s'
    interval = '15s'
    method = 'GET'
    path = '/v1/saude/pronto'
    timeout = '3s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
