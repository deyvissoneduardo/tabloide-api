$kind: http-request
id: e53a0b1c-f03e-5e0a-a29c-5f886cc9f769
description: "`nome` obrigatório, 1–80 caracteres (espaços aparados). Nome repetido na filial: 409 `CATEGORIA_JA_EXISTE`."
url: "{{baseUrl}}/painel/filiais/:filialId/categorias"
method: POST
headers:
  Content-Type: application/json
pathVariables:
  - key: filialId
    value: "{{filialId}}"
    description: Id (UUID v7) da filial do lojista logado.
body:
  type: json
  content: |-
    {
      "nome": "Mercearia"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status esperado (201)', () => pm.expect(pm.response.code).to.be.oneOf([201]));
      pm.test('Tem x-request-id', () => pm.response.to.have.header('x-request-id'));
      if (pm.response.code < 300) {
        const corpo = pm.response.json();
        pm.environment.set('categoriaId', corpo.id);
      }
    language: text/javascript
examples: ./.resources/Criar categoria.resources/examples
order: 1000
