$kind: http-example
request:
  url: "{{baseUrl}}/publico/filiais/:codigo"
  method: GET
  headers:
    - key: Accept-Encoding
      value: gzip
      description: A página é enviada já comprimida quando o cliente aceita gzip.
  pathVariables:
    - key: codigo
      value: "{{codigoPublico}}"
      description: Código público da filial (8 caracteres, alfabeto sem 0 1 i l o I O).
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json; charset=utf-8
    Cache-Control: public, max-age=10
    x-request-id: 0192f0f0-1111-7000-8000-00000000abcd
  body:
    type: json
    content: |-
      {
        "erro": {
          "codigo": "RECURSO_NAO_ENCONTRADO",
          "mensagem": "Página não encontrada."
        }
      }
order: 2000
