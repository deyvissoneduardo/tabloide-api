    content: |-
      {
        "categorias": [
          { "id": "0192f0d0-1a2b-7c3d-8e4f-5a6b7c8d9e02", "produtos": ["0192f0d1-2b3c-7d4e-8f5a-6b7c8d9e0f01"] },
          { "id": "0192f0d0-1a2b-7c3d-8e4f-5a6b7c8d9e02", "produtos": [] }
        ]
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity
