$kind: http-example
request:
  url: "{{baseUrl}}/painel/filiais/:filialId/estrutura"
  method: PUT
  headers:
    Content-Type: application/json
  pathVariables:
    - key: filialId
      value: "{{filialId}}"
      description: Id (UUID v7) da filial do lojista logado.
  body:
    type: json
    content: |-
      {
        "categorias": [
          { "id": "abc", "produtos": [] }
        ]
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
    x-request-id: 0192f0f0-1111-7000-8000-00000000abcd
  body:
    type: json
    content: |-
      {
        "erro": {
          "codigo": "VALIDACAO_INVALIDA",
          "mensagem": "Dados inválidos.",
          "detalhes": {
            "campos": {
              "categorias.0.id": ["id de categoria inválido."]
            }
          }
        }
      }
order: 3000
