$kind: http-request
id: 609eb4a2-649f-5fe5-8da4-422430cba62e
description: "Exclusão lógica em qualquer situação (RN25). Já excluído ou inexistente: 404."
url: "{{baseUrl}}/painel/filiais/:filialId/panfletos/:id"
method: DELETE
pathVariables:
  - key: filialId
    value: "{{filialId}}"
    description: Id (UUID v7) da filial do lojista logado.
  - key: id
    value: "{{panfletoId}}"
    description: Id (UUID v7) do panfleto.
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status esperado (204)', () => pm.expect(pm.response.code).to.be.oneOf([204]));
      pm.test('Tem x-request-id', () => pm.response.to.have.header('x-request-id'));
    language: text/javascript
examples: ./.resources/Excluir panfleto.resources/examples
order: 6000
