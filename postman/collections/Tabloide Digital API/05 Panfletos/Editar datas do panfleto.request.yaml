$kind: http-request
id: c18e7cfd-9e17-5940-a40c-4f97accbc642
description: |-
  Altera `dataInicio` e/ou `dataLimite` (RN26). `dataLimite: null` remove o limite; `dataInicio: null` é recusado.

  - Vigente: o início não muda (409 `DATA_INICIO_IMUTAVEL`); o limite pode ir até hoje.
  - Agendado: início e limite podem mudar.
  - Vencido ou excluído: 409 `ITEM_NAO_EDITAVEL`.

  As mudanças são auditadas.
url: "{{baseUrl}}/painel/filiais/:filialId/panfletos/:id"
method: PATCH
headers:
  Content-Type: application/json
pathVariables:
  - key: filialId
    value: "{{filialId}}"
    description: Id (UUID v7) da filial do lojista logado.
  - key: id
    value: "{{panfletoId}}"
    description: Id (UUID v7) do panfleto.
body:
  type: json
  content: |-
    {
      "dataLimite": "2027-01-15"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status esperado (200)', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test('Tem x-request-id', () => pm.response.to.have.header('x-request-id'));
    language: text/javascript
examples: ./.resources/Editar datas do panfleto.resources/examples
order: 4000
