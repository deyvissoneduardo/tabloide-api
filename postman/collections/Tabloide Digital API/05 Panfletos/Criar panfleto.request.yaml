$kind: http-request
id: 5180da6c-621a-550a-806d-247974c9ae30
description: |-
  Cria o panfleto (`multipart/form-data`). A imagem é processada (até 2400 px, WebP) antes da gravação; a criação é auditada.

  Conflitos de período respondem 409 com `detalhes.conflitoCom` (id e datas do panfleto que conflita).
url: "{{baseUrl}}/painel/filiais/:filialId/panfletos"
method: POST
pathVariables:
  - key: filialId
    value: "{{filialId}}"
    description: Id (UUID v7) da filial do lojista logado.
body:
  type: formdata
  content:
    - type: file
      key: imagem
      src: "{{arquivoImagem}}"
      description: Obrigatório. JPEG, PNG ou WebP.
    - type: text
      key: dataInicio
      value: ""
      description: Opcional, AAAA-MM-DD; não pode ser no passado. Vazio = hoje (RN40).
      disabled: true
    - type: text
      key: dataLimite
      value: 2026-12-31
      description: Opcional, AAAA-MM-DD; ≥ início e ≥ hoje (RN42). Vazio = sem limite.
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status esperado (201)', () => pm.expect(pm.response.code).to.be.oneOf([201]));
      pm.test('Tem x-request-id', () => pm.response.to.have.header('x-request-id'));
      if (pm.response.code < 300) {
        const corpo = pm.response.json();
        pm.environment.set('panfletoId', corpo.id);
      }
    language: text/javascript
examples: ./.resources/Criar panfleto.resources/examples
order: 1000
