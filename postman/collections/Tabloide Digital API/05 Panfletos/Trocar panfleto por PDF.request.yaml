$kind: http-request
id: 78c177bd-9f54-5f7b-996d-a402faa66496
description: |-
  Igual a **Trocar imagem do panfleto**, enviando o PDF de exemplo (`{{arquivoPdf}}`, 1 página A4). A resposta vem com `tipo: "PDF"`, `urlArquivo` terminando em `.pdf` e `largura`/`altura` em pontos (595 × 842).

  Na página pública, com `sePanfleto` ligado, o panfleto aparece como `{ "tipo": "PDF", "arquivoUrl": "…pdf" }` e a página React o desenha com pdf.js.
url: "{{baseUrl}}/painel/filiais/:filialId/panfletos/:id/imagem"
method: PUT
pathVariables:
  - key: filialId
    value: "{{filialId}}"
    description: Id (UUID v7) da filial do lojista logado.
  - key: id
    value: "{{panfletoId}}"
    description: Id (UUID v7) do panfleto.
body:
  type: formdata
  content:
    - type: file
      key: imagem
      src: "{{arquivoPdf}}"
      description: Obrigatório. PDF de exatamente 1 página, sem senha, até 2 MB.
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status esperado (200)', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test('Tem x-request-id', () => pm.response.to.have.header('x-request-id'));
      if (pm.response.code === 200) pm.test('Tipo PDF', () => pm.expect(pm.response.json().tipo).to.eql('PDF'));
    language: text/javascript
examples: ./.resources/Trocar panfleto por PDF.resources/examples
order: 5500
