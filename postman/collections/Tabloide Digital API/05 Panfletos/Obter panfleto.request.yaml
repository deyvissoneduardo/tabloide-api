$kind: http-request
id: d527eaf9-163b-52ea-8db6-b5270e59435c
description: "Inclui excluídos, para consulta (`situacao: EXCLUIDO`, `excluidoEm` preenchido)."
url: "{{baseUrl}}/painel/filiais/:filialId/panfletos/:id"
method: GET
pathVariables:
  - key: filialId
    value: "{{filialId}}"
    description: Id (UUID v7) da filial do lojista logado.
  - key: id
    value: "{{panfletoId}}"
    description: Id (UUID v7) do panfleto.
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status esperado (200)', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test('Tem x-request-id', () => pm.response.to.have.header('x-request-id'));
    language: text/javascript
examples: ./.resources/Obter panfleto.resources/examples
order: 3000
