$kind: http-example
request:
  url: "{{baseUrl}}/painel/filiais/:filialId/panfletos/:id/imagem"
  method: PUT
  pathVariables:
    - key: filialId
      value: "{{filialId}}"
      description: Id (UUID v7) da filial do lojista logado.
    - key: id
      value: "{{panfletoId}}"
      description: Id (UUID v7) do panfleto.
  body:
    type: formdata
    content:
      - type: file
        key: imagem
        src: "{{arquivoImagem}}"
        description: Obrigatório. JPEG, PNG, WebP ou PDF de 1 página.
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json; charset=utf-8
    x-request-id: 0192f0f0-1111-7000-8000-00000000abcd
  body:
    type: json
    content: |-
      {
        "erro": {
          "codigo": "ITEM_NAO_EDITAVEL",
          "mensagem": "Itens vencidos ou excluídos não podem ser alterados."
        }
      }
order: 2000
