$kind: http-example
request:
  url: "{{baseUrl}}/painel/filiais/:filialId/panfletos/:id"
  method: PATCH
  headers:
    Content-Type: application/json
  pathVariables:
    - key: filialId
      value: "{{filialId}}"
      description: Id (UUID v7) da filial do lojista logado.
    - key: id
      value: "{{panfletoId}}"
      description: Id (UUID v7) do panfleto.
  body:
    type: json
    content: |-
      {
        "dataLimite": "2027-01-15"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json; charset=utf-8
    x-request-id: 0192f0f0-1111-7000-8000-00000000abcd
  body:
    type: json
    content: |-
      {
        "erro": {
          "codigo": "DATA_INICIO_IMUTAVEL",
          "mensagem": "A data de início de um item já vigente não pode ser alterada.",
          "detalhes": {
            "campo": "dataInicio"
          }
        }
      }
order: 2000
