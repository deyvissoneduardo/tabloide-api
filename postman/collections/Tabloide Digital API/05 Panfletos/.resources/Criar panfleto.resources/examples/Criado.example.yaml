$kind: http-example
request:
  url: "{{baseUrl}}/painel/filiais/:filialId/panfletos"
  method: POST
  pathVariables:
    - key: filialId
      value: "{{filialId}}"
      description: Id (UUID v7) da filial do lojista logado.
  body:
    type: formdata
    content:
      - type: file
        key: imagem
        src: "{{arquivoImagem}}"
        description: Obrigatório. JPEG, PNG ou WebP.
      - type: text
        key: dataInicio
        value: ""
        description: Opcional, AAAA-MM-DD; não pode ser no passado. Vazio = hoje (RN40).
        disabled: true
      - type: text
        key: dataLimite
        value: 2026-12-31
        description: Opcional, AAAA-MM-DD; ≥ início e ≥ hoje (RN42). Vazio = sem limite.
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json; charset=utf-8
    x-request-id: 0192f0f0-1111-7000-8000-00000000abcd
  body:
    type: json
    content: |-
      {
        "id": "0192f0c0-8e40-7d32-9f5c-3e4f5a6b7c03",
        "filialId": "0192f0b4-7d3f-7c21-8e4b-2d3e4f5a6b02",
        "urlImagem": "https://xyz.supabase.co/storage/v1/object/public/midia/0192f0a1-6c2e-7b10-9f3a-1c2d3e4f5a01/panfleto/0192f0c0.webp",
        "largura": 1600,
        "altura": 2263,
        "dataInicio": "2026-10-18",
        "dataLimite": "2026-10-31",
        "situacao": "VIGENTE",
        "editavel": true,
        "criadoEm": "2026-10-18T13:10:00.000Z",
        "excluidoEm": null
      }
order: 1000
