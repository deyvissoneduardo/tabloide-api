$kind: http-request
id: de215ebf-88aa-5599-9111-f1aa2a96d5db
description: O processo responde. Não depende do banco (usado para reiniciar o container).
url: "{{baseUrl}}/saude/vivo"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
