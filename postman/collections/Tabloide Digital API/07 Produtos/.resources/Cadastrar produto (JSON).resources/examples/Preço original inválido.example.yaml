$kind: http-example
request:
  url: "{{baseUrl}}/painel/filiais/:filialId/produtos"
  method: POST
  headers:
    Content-Type: application/json
  pathVariables:
    - key: filialId
      value: "{{filialId}}"
      description: Id (UUID v7) da filial do lojista logado.
  body:
    type: json
    content: |-
      {
        "nome": "Arroz Tipo 1",
        "categoriaId": "{{categoriaId}}",
        "quantidade": "5kg",
        "precoPromocionalCentavos": 2199,
        "precoOriginalCentavos": 2649,
        "observacao": "Limite 3 por cliente",
        "dataLimite": "2026-12-31"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity
  headers:
    Content-Type: application/json; charset=utf-8
    x-request-id: 0192f0f0-1111-7000-8000-00000000abcd
  body:
    type: json
    content: |-
      {
        "erro": {
          "codigo": "PRECO_ORIGINAL_INVALIDO",
          "mensagem": "O preço original precisa ser maior que o preço promocional.",
          "detalhes": {
            "precoPromocionalCentavos": 1000,
            "precoOriginalCentavos": 900
          }
        }
      }
order: 2000
