  method: GET
  queryParams:
    - key: situacao
      value: VIGENTE,AGENDADO
      description: CSV com AGENDADO, VIGENTE, VENCIDO, EXCLUIDO. Ausente = todos os não excluídos.
    - key: categoriaId
      value: "{{categoriaId}}"
      disabled: true
      description: Filtra por categoria.
    - key: busca
      value: arroz
      disabled: true
      description: Busca no nome sem acento nem caixa ("acucar" acha "Açúcar"); até 60.
    - key: pagina
      value: "1"
      description: Página (≥ 1).
    - key: porPagina
      value: "50"
      description: Itens por página (1–100).
  pathVariables:
    - key: filialId
      value: "{{filialId}}"
      description: Id (UUID v7) da filial do lojista logado.
