$kind: http-example
request:
  url: "{{baseUrl}}/painel/filiais/:filialId/produtos"
  method: POST
  pathVariables:
    - key: filialId
      value: "{{filialId}}"
      description: Id (UUID v7) da filial do lojista logado.
  body:
    type: formdata
    content:
      - type: text
        key: nome
        value: Refrigerante cola
        description: Obrigatório.
      - type: text
        key: categoriaId
        value: "{{categoriaId}}"
        description: Obrigatório.
      - type: text
        key: quantidade
        value: 2 L
        description: Opcional.
      - type: text
        key: precoPromocionalCentavos
        value: "799"
        description: Obrigatório; inteiro em centavos (texto no multipart).
      - type: text
        key: precoOriginalCentavos
        value: "1099"
        description: Opcional.
      - type: text
        key: observacao
        value: Limite 3 por cliente
        description: Opcional.
      - type: text
        key: dataLimite
        value: 2026-12-31
        description: Opcional.
      - type: file
        key: foto
        src: "{{arquivoImagem}}"
        description: Opcional. JPEG, PNG ou WebP; reduzida a 800 px, WebP.
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json; charset=utf-8
    x-request-id: 0192f0f0-1111-7000-8000-00000000abcd
  body:
    type: json
    content: |-
      {
        "id": "0192f0d0-a062-7f54-9b7e-5a6b7c8d9e05",
        "filialId": "0192f0b4-7d3f-7c21-8e4b-2d3e4f5a6b02",
        "categoria": {
          "id": "0192f0c1-9f51-7e43-8a6d-4f5a6b7c8d04",
