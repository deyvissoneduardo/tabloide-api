$kind: http-request
id: c0d0a5a1-c8db-5374-b949-9139a9b5ad59
description: "Remove a foto (`urlFoto: null`) e devolve o produto. Sem foto: nada muda."
url: "{{baseUrl}}/painel/filiais/:filialId/produtos/:produtoId/foto"
method: DELETE
pathVariables:
  - key: filialId
    value: "{{filialId}}"
    description: Id (UUID v7) da filial do lojista logado.
  - key: produtoId
    value: "{{produtoId}}"
    description: Id (UUID v7) do produto.
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status esperado (200)', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test('Tem x-request-id', () => pm.response.to.have.header('x-request-id'));
    language: text/javascript
examples: ./.resources/Remover foto do produto.resources/examples
order: 7000
