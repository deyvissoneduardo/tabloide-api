$kind: http-request
id: bef4eca3-2d9b-5237-b100-1a76dcf032a3
description: "Exclusão lógica (RN25), permitida também para vencidos. Já excluído: 409 `ITEM_NAO_EDITAVEL`."
url: "{{baseUrl}}/painel/filiais/:filialId/produtos/:produtoId"
method: DELETE
pathVariables:
  - key: filialId
    value: "{{filialId}}"
    description: Id (UUID v7) da filial do lojista logado.
  - key: produtoId
    value: "{{produtoId}}"
    description: Id (UUID v7) do produto.
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status esperado (204)', () => pm.expect(pm.response.code).to.be.oneOf([204]));
      pm.test('Tem x-request-id', () => pm.response.to.have.header('x-request-id'));
    language: text/javascript
examples: ./.resources/Excluir produto.resources/examples
order: 8000
