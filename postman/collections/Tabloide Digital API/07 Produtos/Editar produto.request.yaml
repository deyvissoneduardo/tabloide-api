$kind: http-request
id: 0e63af92-1152-5c16-abcf-f8dc6b885d70
description: |-
  Edição parcial (JSON). `null` limpa `precoOriginalCentavos`, `quantidade`, `descricao`, `observacao` e `dataLimite`; `nome`, `categoriaId`, `precoPromocionalCentavos` e `dataInicio` não aceitam `null`. A foto tem rota própria.

  - Só vigente ou agendado (senão 409 `ITEM_NAO_EDITAVEL`); o início de um vigente não muda (409 `DATA_INICIO_IMUTAVEL`).
  - RN21 vale sobre os valores resultantes: baixar só o original abaixo do promocional também falha.
  - `categoriaId` só aceita categoria da mesma filial.
  - Sem mudança real: nada é gravado nem auditado.
url: "{{baseUrl}}/painel/filiais/:filialId/produtos/:produtoId"
method: PATCH
headers:
  Content-Type: application/json
pathVariables:
  - key: filialId
    value: "{{filialId}}"
    description: Id (UUID v7) da filial do lojista logado.
  - key: produtoId
    value: "{{produtoId}}"
    description: Id (UUID v7) do produto.
body:
  type: json
  content: |-
    {
      "precoPromocionalCentavos": 1999,
      "observacao": null
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status esperado (200)', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test('Tem x-request-id', () => pm.response.to.have.header('x-request-id'));
    language: text/javascript
examples: ./.resources/Editar produto.resources/examples
order: 5000
