$kind: http-request
id: 16fce0b1-8e73-553a-884f-4ef311267a9b
description: |-
  Cria a filial e gera o `codigoPublico` (8 caracteres sem ambíguos) usado na URL pública e no QR Code.

  | Campo | Regra |
  | --- | --- |
  | `nome` | obrigatório, até 120 |
  | `endereco` | obrigatório, objeto completo (abaixo) |
  | `endereco.cep` | obrigatório, `00000-000` ou `00000000`; volta só com os 8 dígitos |
  | `endereco.logradouro` | obrigatório, até 200 |
  | `endereco.numero` | obrigatório, até 20 |
  | `endereco.complemento` | opcional, até 100; ausente volta `null` |
  | `endereco.bairro` | obrigatório, até 100 |
  | `endereco.cidade` | obrigatório, até 100 |
  | `endereco.uf` | obrigatório, 2 caracteres (a sigla é validada no front) |
  | `fusoHorario` | opcional, fuso IANA (ex.: `America/Manaus`); padrão `FUSO_HORARIO_PADRAO` |

  Responde 201 com `Location`. Pode responder 409 `LIMITE_DO_PLANO_ATINGIDO` se o lojista tiver limite de filiais.
url: "{{baseUrl}}/painel/filiais"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nome": "Centro",
      "endereco": {
        "cep": "13010-111",
        "logradouro": "Rua das Flores",
        "numero": "120",
        "complemento": "Loja 2",
        "bairro": "Centro",
        "cidade": "Campinas",
        "uf": "SP"
      },
      "fusoHorario": "America/Sao_Paulo"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status esperado (201)', () => pm.expect(pm.response.code).to.be.oneOf([201]));
      pm.test('Tem x-request-id', () => pm.response.to.have.header('x-request-id'));
      if (pm.response.code < 300) {
        const corpo = pm.response.json();
        pm.environment.set('filialId', corpo.id);
        pm.environment.set('codigoPublico', corpo.codigoPublico);
      }
    language: text/javascript
examples: ./.resources/Criar filial.resources/examples
order: 1000
