$kind: http-example
request:
  url: "{{baseUrl}}/painel/filiais/:id"
  method: DELETE
  pathVariables:
    - key: id
      value: "{{filialTemporariaId}}"
      description: Id (UUID v7) da filial. O script de pré-requisição preenche com uma filial temporária.
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json; charset=utf-8
    x-request-id: 0192f0f0-1111-7000-8000-00000000abcd
  body:
    type: json
    content: |-
      {
        "erro": {
          "codigo": "RECURSO_NAO_ENCONTRADO",
          "mensagem": "Não encontrado."
        }
      }
order: 2000
