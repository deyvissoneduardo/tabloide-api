$kind: http-example
request:
  url: "{{baseUrl}}/auth/login"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "email": "{{email}}",
        "senha": "{{senha}}"
      }
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/json; charset=utf-8
    Retry-After: "900"
    x-request-id: 0192f0f0-1111-7000-8000-00000000abcd
  body:
    type: json
    content: |-
      {
        "erro": {
          "codigo": "MUITAS_TENTATIVAS",
          "mensagem": "Muitas tentativas. Aguarde e tente novamente."
        }
      }
order: 3000
